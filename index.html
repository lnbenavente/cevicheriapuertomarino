<!-- SCRIPT DE CONEXIÓN CON APPS SCRIPT -->
  <script>
    // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT QUE TERMINA EN /exec
    const API_URL = "https://script.google.com/macros/s/AKfycbwmCBrhg62Betq01j2Xi5HcQ1Q5t0OF-qsmG1jt6OEKCQhX0BGLkvMFKjMx_T-QDiFp/exec";

    const fallbackData = {
      config: {
        nombre_negocio: "Cevichería Puerto Marino",
        whatsapp: "51987654321",
        whatsapp_mensaje: "¡Hola! Vengo de la web y deseo realizar un pedido.",
        direccion: "Av. La Marina 1450, Pueblo Libre, Lima",
        google_maps_url: "https://maps.google.com",
        horario: "Lun - Dom: 10:00 AM - 6:00 PM",
        costo_delivery: "S/ 7.00",
        estado_local: "Abierto"
      },
      carta: [
        { id: 1, nombre: "Ceviche Clásico", categoria: "Ceviches", precio: 38, descripcion: "Trozos de pescado fresco, limón sutil, cebolla roja, choclo y camote.", etiqueta: "Popular", imagen: "https://images.unsplash.com/photo-1535399831218-d5bd36d1a6b3?w=600" }
      ]
    };

    let itemsGlobales = [];
    let configGlobal = {};

    document.addEventListener("DOMContentLoaded", () => {
      cargarDatos();
    });

    function cargarDatos() {
      // Validar si la URL está configurada
      if (!API_URL || API_URL.includes("TU_ID_DE_APPS_SCRIPT")) {
        console.warn("API_URL no configurada. Usando datos de respaldo.");
        renderizarTodo(fallbackData);
        return;
      }

      // Consulta directa a la API de Google Apps Script con el parámetro ?api=true
      fetch(API_URL + "?api=true")
        .then(res => res.json())
        .then(data => renderizarTodo(data))
        .catch(err => {
          console.warn("Error de red al conectar con Apps Script. Usando respaldo.", err);
          renderizarTodo(fallbackData);
        });
    }

    function renderizarTodo(data) {
      if (!data || !data.carta || data.carta.length === 0) data = fallbackData;
      
      configGlobal = data.config || fallbackData.config;
      itemsGlobales = data.carta || fallbackData.carta;

      // Asignar datos de configuración
      const nombre = configGlobal.nombre_negocio || "Puerto Marino";
      document.getElementById("ui-nombre-negocio").innerText = nombre;
      document.getElementById("ui-hero-titulo").innerText = `El Mejor Sabor en ${nombre}`;
      document.getElementById("ui-direccion").innerHTML = `<i class="fas fa-map-marker-alt text-[#ffb703] mr-2"></i>${configGlobal.direccion || ''}`;
      document.getElementById("ui-delivery-info").innerHTML = `<i class="fas fa-truck text-[#00b4d8] mr-2"></i>Delivery: ${configGlobal.costo_delivery || 'Consultar'}`;
      document.getElementById("ui-horario").innerText = configGlobal.horario || '';
      document.getElementById("ui-link-maps").href = configGlobal.google_maps_url || '#';

      // Estado
      const badge = document.getElementById("ui-badge-estado");
      const estado = configGlobal.estado_local || "Abierto";
      badge.innerText = estado;

      // WhatsApp y Redes
      const wspNum = configGlobal.whatsapp || "";
      const msgDefault = encodeURIComponent(configGlobal.whatsapp_mensaje || "Hola, deseo hacer un pedido");
      const wspLink = `https://wa.me/${wspNum}?text=${msgDefault}`;
      
      document.getElementById("ui-btn-header-wsp").href = wspLink;
      document.getElementById("ui-btn-float-wsp").href = wspLink;
      document.getElementById("ui-fb").href = configGlobal.facebook || "#";
      document.getElementById("ui-ig").href = configGlobal.instagram || "#";
      document.getElementById("ui-tk").href = configGlobal.tiktok || "#";

      // Categorías dinámicas
      const categorias = ["Todos", ...new Set(itemsGlobales.map(item => item.categoria))];
      const contCat = document.getElementById("ui-categorias");
      contCat.innerHTML = categorias.map((cat, idx) => `
        <button onclick="filtrar('${cat}')" class="btn-cat ${idx === 0 ? 'bg-[#00b4d8] text-slate-900' : 'bg-slate-800 text-slate-300'} font-bold px-4 py-2 rounded-xl whitespace-nowrap transition hover:bg-[#00b4d8] hover:text-slate-900">${cat}</button>
      `).join('');

      renderizarPlatos(itemsGlobales);
    }

    function renderizarPlatos(items) {
      const catalogo = document.getElementById("ui-catalogo");
      const wspNum = configGlobal.whatsapp || "";

      if(items.length === 0) {
        catalogo.innerHTML = `<p class="col-span-full text-center text-slate-500 py-8">No se encontraron productos en esta categoría.</p>`;
        return;
      }

      catalogo.innerHTML = items.map(item => {
        const mensajePlato = encodeURIComponent(`¡Hola! Deseo pedir: *${item.nombre}* (S/ ${item.precio})`);
        const linkPedido = `https://wa.me/${wspNum}?text=${mensajePlato}`;
        const badgeTag = item.etiqueta ? `<span class="absolute top-3 left-3 bg-[#ffb703] text-slate-900 text-[10px] font-black uppercase px-2 py-1 rounded-md shadow-md">${item.etiqueta}</span>` : '';

        return `
          <div class="bg-[#1c2541] rounded-2xl overflow-hidden border border-slate-700/50 flex flex-col justify-between hover:border-[#00b4d8]/50 transition duration-300 shadow-xl group">
            <div class="relative h-48 overflow-hidden bg-slate-800">
              <img src="${item.imagen}" alt="${item.nombre}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
              ${badgeTag}
            </div>
            <div class="p-5 flex-grow flex flex-col justify-between space-y-4">
              <div>
                <div class="flex justify-between items-start gap-2 mb-1">
                  <h3 class="font-bold text-lg text-white group-hover:text-[#00b4d8] transition">${item.nombre}</h3>
                  <span class="text-lg font-black text-[#00b4d8] bg-[#00b4d8]/10 px-2 py-0.5 rounded-lg border border-[#00b4d8]/20">S/${item.precio}</span>
                </div>
                <p class="text-slate-400 text-xs line-clamp-2 leading-relaxed">${item.descripcion}</p>
              </div>
              <a href="${linkPedido}" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs text-center transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-950/40">
                <i class="fab fa-whatsapp text-sm"></i> Pedir este plato
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function filtrar(categoria) {
      const botones = document.querySelectorAll('.btn-cat');
      botones.forEach(btn => {
        if(btn.innerText === categoria) {
          btn.className = "btn-cat bg-[#00b4d8] text-slate-900 font-bold px-4 py-2 rounded-xl whitespace-nowrap transition";
        } else {
          btn.className = "btn-cat bg-slate-800 text-slate-300 font-bold px-4 py-2 rounded-xl whitespace-nowrap transition hover:bg-[#00b4d8] hover:text-slate-900";
        }
      });

      if (categoria === 'Todos') {
        renderizarPlatos(itemsGlobales);
      } else {
        const filtrados = itemsGlobales.filter(item => item.categoria === categoria);
        renderizarPlatos(filtrados);
      }
    }
  </script>
